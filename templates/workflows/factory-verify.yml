# factory-verify: the clean build of one submission on a runner that holds nothing to steal.
#
# Copy this file to .github/workflows/factory-verify.yml of the project. It must live on the default
# branch, and .github/** must be a hold path, so a patch can never change what checks it.
#
# The hub starts it with workflow_dispatch and later reads only the conclusion of the run through the
# GitHub API with a read only token. The job reports nothing itself.
#
# Never add to this file: a secret, the pull request target trigger, a step that takes its script from the patch,
# or a write permission. Lines marked PROJECT are the only places a project edits.

name: factory-verify

# The run name carries the submission hash. The hub finds its run by this name.
run-name: verify ${{ inputs.submission }}

on:
  workflow_dispatch:
    inputs:
      submission:
        description: SHA 256 of the bundle, 64 lower case hex characters
        required: true
        type: string
      order:
        description: Order id, for example t412
        required: true
        type: string
      base:
        description: Base commit the bundle applies on, 40 hex characters
        required: true
        type: string
      hub:
        description: Base URL of the hub, https only
        required: true
        type: string

# No permissions at all, for the workflow and for the job.
permissions: {}

# One run per submission. A second dispatch waits and does not cancel the first.
concurrency:
  group: factory-verify-${{ inputs.submission }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      # Inputs travel through the environment, never through the text of a script.
      SUBMISSION: ${{ inputs.submission }}
      ORDER: ${{ inputs.order }}
      BASE: ${{ inputs.base }}
      HUB: ${{ inputs.hub }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          [[ "$SUBMISSION" =~ ^[0-9a-f]{64}$ ]] || { echo "submission is not a SHA 256"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "base is not a commit id"; exit 1; }
          [[ "$ORDER" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "order is not an order id"; exit 1; }
          [[ "$HUB" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || { echo "hub is not an https origin"; exit 1; }

      # The base commit, from the repository. No token is kept in the checkout.
      - name: Check out base
        uses: actions/checkout@v4 # PROJECT: pin to a full commit SHA
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch bundle
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 120 \
            --max-filesize 10485760 --output "$RUNNER_TEMP/bundle.bin" \
            "$HUB/api/bundle/$SUBMISSION" # PROJECT: the path of the hub endpoint

      - name: Check bundle hash
        run: |
          set -euo pipefail
          echo "$SUBMISSION  $RUNNER_TEMP/bundle.bin" | sha256sum --check --strict -

      # Hooks are off. The bundle is only read as git objects. Nothing in it is run here.
      - name: Import bundle ref
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          git -c core.hooksPath=/dev/null -c protocol.version=2 \
            fetch --no-tags --no-recurse-submodules "$RUNNER_TEMP/bundle.bin" \
            'refs/heads/*:refs/factory/incoming/*'
          HEAD_REF="$(git for-each-ref --format='%(refname)' refs/factory/incoming | head -n 1)"
          [ -n "$HEAD_REF" ] || { echo "the bundle holds no branch"; exit 1; }
          git -c core.hooksPath=/dev/null -c submodule.recurse=false checkout --detach --quiet "$HEAD_REF"
          # The bundle must sit directly on the base.
          git merge-base --is-ancestor "$BASE" HEAD || { echo "the bundle does not sit on the base"; exit 1; }

      # The only step with network that touches project code: dependencies from the lock file.
      - name: Fetch dependencies
        run: |
          set -euo pipefail
          cargo fetch --locked # PROJECT: your dependency fetch, lock file only

      # The done condition comes from the hub by order id. It is never read from the patch.
      - name: Read done condition
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 \
            --max-filesize 65536 --output "$RUNNER_TEMP/done_when.txt" \
            "$HUB/api/order/$ORDER/done_when" # PROJECT: the path of the hub endpoint
          test -s "$RUNNER_TEMP/done_when.txt" || { echo "the order has no done condition"; exit 1; }

      # The network is cut for the build where the runner allows it (a new network namespace).
      # Cargo is also told to stay offline, so a missing cut still blocks registry access.
      - name: Build and test touched crates
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true
          # PROJECT: print the cargo arguments that select the touched crates, for example
          # "-p crate_a -p crate_b". The default tests the whole workspace.
          SELECT="--workspace"
          if sudo -n unshare --net true 2>/dev/null; then
            echo "network cut: yes"
            sudo -n env PATH="$PATH" HOME="$HOME" unshare --net -- bash -c '
              ip link set lo up
              exec setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --clear-groups \
                env CARGO_NET_OFFLINE=true \
                bash -c "cargo build --locked --offline $0 && cargo test --locked --offline $0"
            ' "$SELECT"
          else
            echo "network cut: no, the runner does not allow it. Cargo stays offline."
            cargo build --locked --offline $SELECT # PROJECT: your build command
            cargo test --locked --offline $SELECT # PROJECT: your test command
          fi

      - name: Run done condition
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true
          # One command per line, taken from the hub's order, run in the repository root.
          while IFS= read -r cmd || [ -n "$cmd" ]; do
            [ -n "$cmd" ] || continue
            echo "+ $cmd"
            bash -c "$cmd"
          done < "$RUNNER_TEMP/done_when.txt"
